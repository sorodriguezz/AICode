[package]
name = "aicode"
version = "0.4.0"
description = "AICode — a notepad that grows into an editor, one mod at a time"
edition = "2021"
publish = false

[lib]
name = "aicode_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
portable-pty = "0.8"
tiny_http = "0.12"
ignore = "0.4"
regex = "1"
rand = "0.9"
base64 = "0.22"
trash = "5"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tauri-plugin-updater = "2"
# The same TLS setup as tauri-plugin-updater (rustls with ring): nothing new to build.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
opt-level = 3
strip = true
codegen-units = 4

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSDocumentController", "NSMenu", "NSMenuItem"] }
